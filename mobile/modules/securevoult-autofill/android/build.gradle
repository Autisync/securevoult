plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.autisync.securevoult'
version = '1.0.0'

android {
  namespace "com.autisync.securevoult.autofill"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.biometric:biometric:1.1.0"
  implementation "androidx.fragment:fragment-ktx:1.8.5"
}
