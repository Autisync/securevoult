# SecureVoult on your own server.
#
#   cp .env.example .env.production   # fill it in (see DEPLOY.md)
#   docker compose --env-file .env.production up -d --build
#
# The app listens on 127.0.0.1:3100 only; put your HTTPS reverse proxy in front.
# MongoDB is private to this compose network and keeps its data in a volume.
# Nightly dumps land in ./backups (vaults in them are still encrypted).

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: securevoult:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      MONGODB_URI: mongodb://mongo:27017/securevoult
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--bind_ip_all", "--quiet"]
    volumes:
      - securevoult-db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    image: mongo:7
    restart: unless-stopped
    depends_on: [mongo]
    volumes:
      - ./backups:/backups
    # Once a day; keeps the last 14 dumps.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/securevoult-$$(date +%F).archive.gz
          mongodump --uri=mongodb://mongo:27017/securevoult --archive="$$f" --gzip --quiet && echo "backup $$f"
          ls -1t /backups/securevoult-*.archive.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400
        done

volumes:
  securevoult-db:
